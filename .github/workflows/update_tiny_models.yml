name: Self-hosted runner (push)

on:
  push:
    branches:
      - auto_tiny

env:
  TOKEN: ${{ secrets.SYLVAIN_HF_TOKEN }}

jobs:
  update_tiny_models:
    name: Update tiny models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transformers
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Install
        run: python -m pip install -U .[dev]

      - name: Update tiny models
        run: | 
          python utils/update_tiny_models.py
          mkdir tiny_model_creation_reports
          mv tiny_model_summary.json tiny_model_creation_reports
          mv updated_tiny_model_summary.json tiny_model_creation_reports
          mv tiny_model_creation_report.json tiny_model_creation_reports
          mv simple_report.txt tiny_model_creation_reports
          mv failed_report.json tiny_model_creation_reports
          mv simple_failed_report.txt tiny_model_creation_reports
          mv failed_uploads.json tiny_model_creation_reports

      - name: Full report
        run: cat tiny_model_creation_reports/tiny_model_creation_report.json

      - name: Failure report
        run: cat tiny_model_creation_reports/simple_failed_report.txt

      - name: Summary report
        run: cat tiny_model_creation_reports/tiny_model_summary.json

      - name: Test suite reports artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v3
        with:
          name: tiny_model_creation_reports
          path: tiny_model_creation_reports
